name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm: native ARM64 Linux (Raspberry Pi / ARM NAS class),
        # free for public repositories.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ["3.12", "3.13"]
        exclude:
          # Full Python matrix on x86 Linux; one Python per other OS to keep
          # runner usage (macOS/Windows bill at higher multipliers) low.
          - { os: ubuntu-24.04-arm, python-version: "3.12" }
          - { os: macos-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.12" }
    steps:
      - uses: actions/checkout@v5

      - name: Install external tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mkvtoolnix

      - name: Install external tools (macOS)
        if: runner.os == 'macOS'
        run: brew install mkvtoolnix

      - name: Install external tools (Windows)
        if: runner.os == 'Windows'
        run: choco install -y mkvtoolnix

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        # A hung UI test (e.g. a Textual shutdown deadlock) fails here
        # instead of holding a runner for hours.
        timeout-minutes: 15
        run: uv run pytest -ra

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check --config-file ty.toml .

  mkvmerge-versions:
    # The mkvmerge contract tests (docs/formats/mkvmerge.md) with the oldest
    # versions mkvsmith's features need and the newest release, each from
    # its AppImage (scripts/mkvmerge_versions.py). The other jobs cover the
    # packaged versions.
    name: mkvmerge versions (54, 81, latest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cache unpacked MKVToolNix AppImages
        uses: actions/cache@v6
        with:
          path: ~/.cache/mkvsmith/mkvtoolnix
          # Versions already unpacked are reused; a newer "latest" is
          # downloaded (about 60 MB) until the key changes.
          key: mkvtoolnix-appimages-v1

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --python 3.13

      - name: Run the contract tests with each version
        run: uv run python scripts/mkvmerge_versions.py 54 81 latest
