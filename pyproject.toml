[project]
name = "mkvsmith"
version = "0.5.0"
description = "MakeMKV-like DVD/Blu-ray ripper using mkvmerge (MKVToolNix)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "rich>=15.0.0",
    "xdg-base-dirs>=6.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pytest>=8.0.0",
    "ty>=0.0.71",
]

[tool.ruff]
# Explicitly anchor ruff's config discovery to this project: without a
# [tool.ruff] section, ruff walks up and can inherit an unrelated ruff.toml
# from a parent directory (whose `include` list silently matches none of
# mkvsmith's files, making `ruff check` pass on zero files).
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
