[project]
name = "mkvsmith"
version = "0.1.0"
description = "MakeMKV-like DVD/Blu-ray ripper using mkvmerge (MKVToolNix)"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = [
    "rich>=15.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.21",
    "pytest>=8.0.0",
    "ty>=0.0.71",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
